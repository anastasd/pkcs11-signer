<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PKCS11 Signature Generator</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <main class="container">

    <div class="tabs-container w-100">
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="tab-1">Sign a file</button>
        <button class="tab-btn" data-tab="tab-2">Verify Signature</button>
      </div>

      <div id="tab-1" class="tab-content active">
        <h4>Sign a file</h4>
        <p>Select a file you would like to create signature of.</p>

        <div class="buttons-row">
          <input type="file" id="sign-file" />
          <button type="button" id="sign-button">Sign</button>
        </div>
      </div>

      <div id="tab-2" class="tab-content">
        <h4>Verify Signature</h4>
        <p>Select a file in the first input and its signature in the second one to verify it.
        </p>

        <div class="buttons-row">
          <div>
            <p>Original file</p>
            <input type="file" id="signed-file" />
          </div>
          <div>
            <p>Signature</p>
            <input type="file" id="signature" accept=".sig" />
          </div>
          <div>
            <p>&nbsp;</p>
            <button type="button" id="verify-button">Verify</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <section class="overlay" id="pin-code-modal">
    <div class="modal-window">
      <p>Please enter your PIN code</p>
      <input type="password" id="pin-code" />
      <div>
        <button type="button" id="ok-button">OK</button>
        <button type="button" id="cancel-button">Cancel</button>
      </div>
    </div>
  </section>

</body>

</html>
